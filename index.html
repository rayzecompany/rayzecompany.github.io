<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rayze Company</title>
  <meta name="description" content="The Rayze Company makes apps and games.">
  <link rel="icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>

    <header class="hero">
      <img src="/logo.png" alt="The Rayze Company logo">
      <p>The Rayze Company</p>
    </header>

    <!-- PRODUCTS: copy one <li>...</li> block to add a product -->
    <section>
      <h2>Products</h2>
      <ul>
        <li>
          <div>
            <a class="name" href="/products/arete/">Arete</a>
            <p class="desc">A workout log that tells you what to train next.</p>
          </div>
          <span class="tag">Beta</span>
        </li>
        <li>
          <div>
            <a class="name" href="/products/pure-poker-simulator/">Pure Poker Simulator</a>
            <p class="desc">Texas Hold'em against characters from six TV comedies.</p>
          </div>
          <span class="tag">Mac · Windows</span>
        </li>
        <li>
          <div>
            <span class="name">Trickster</span>
          </div>
          <span class="tag">Coming soon</span>
        </li>
      </ul>
    </section>

    <!-- SOCIALS: copy one <li>...</li> block to add a link -->
    <section>
      <h2>Socials</h2>
      <ul>
        <li>
          <a class="name" href="https://github.com/rayzecompany" target="_blank" rel="noopener">GitHub</a>
          <span class="tag">↗</span>
        </li>
      </ul>
    </section>

    <footer>© 2026 The Rayze Company</footer>

  </main>
</body>
</html>
